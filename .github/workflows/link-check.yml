name: Broken Link Check

on:
  schedule:
    - cron: '0 6 * * 1'  # كل يوم اثنين 06:00 UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links with lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --exclude-loopback --exclude-mail .
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Open issue when broken links are found
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🚨 تقرير الروابط المعطلة (lychee)"
          content-filepath: ./lychee/out.md
          labels: bug, links
